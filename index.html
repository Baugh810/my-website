<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互动小游戏网页</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1>我的互动小世界</h1>

    <div id="character" class="character">🐱</div>

    <p id="storyText">小猫正在等待你的选择……</p>
    <p>能量值：<span id="score">0</span></p>

    <button id="feedBtn">喂它小鱼干</button>
    <button id="playBtn">陪它玩</button>
    <button id="resetBtn">重置</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
